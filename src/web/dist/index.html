   Sessions.jl Theme — Single source of truth for ALL colors.

   Every component references these CSS custom properties.
   Change a color here → entire IDE updates instantly.

   Shared warm neutrals with Therapy.jl ecosystem.
   Rose accent unique to Sessions.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* ── Warm Neutrals (shared with Therapy.jl) ── */
  --warm-50:  #f8f7f4;
  --warm-100: #f0ece4;
  --warm-200: #e8e3d9;
  --warm-300: #d4d0c8;
  --warm-400: #9a9590;
  --warm-500: #8a8680;
  --warm-600: #6b6560;
  --warm-700: #5a5855;
  --warm-800: #2a2520;
  --warm-900: #1a1918;
  --warm-950: #111110;

  /* ── Sessions Accent — Rose ── */
  --accent:     #d4759a;
  --accent-dim: rgba(212, 117, 154, 0.08);
  --accent-hov: rgba(212, 117, 154, 0.18);

  /* ── Status Colors (semantic, not accent) ── */
  --status-done:    #56d4a0;   /* green — cell executed successfully */
  --status-running: #d4a056;   /* amber — cell currently running */
  --status-stale:   #d4a056;   /* amber — cell needs re-run */
  --status-error:   #dc3545;   /* red — cell errored */

  /* ── Light Mode Surfaces ── */
  --workspace-bg:    var(--warm-50);    /* beige workspace background */
  --panel-bg:        #ffffff;           /* white notebook/explorer panels */
  --cell-bg:         var(--warm-50);    /* beige code cells = workspace */
  --cell-border:     var(--warm-200);
  --cell-border-hov: var(--warm-300);
  --chrome-bg:       var(--warm-100);   /* tab bars, terminal headers */
  --chrome-active:   #ffffff;           /* active tab matches panel-bg */
  --divider:         var(--warm-200);
  --term-bg:         var(--warm-100);   /* terminal body — distinct from notebook */
  --term-border:     #ffffff;           /* bright border so term doesn't blend */

  /* ── Light Mode Text ── */
  --text-1: var(--warm-800);   /* primary text */
  --text-2: var(--warm-600);   /* secondary text */
  --text-3: var(--warm-400);   /* tertiary / muted */
  --output-text: var(--warm-600);

  /* ── Light Mode Misc ── */
  --selection-bg: rgba(86, 212, 160, 0.15);
  --panel-shadow: none;
  --scrollbar-thumb: var(--warm-300);
}

/* ── Dark Mode Overrides ── */
.dark {
  --workspace-bg:    #1a2332;
  --panel-bg:        #0f1419;
  --cell-bg:         #1a2332;          /* = workspace */
  --cell-border:     #1c2736;
  --cell-border-hov: #2a3a4f;
  --chrome-bg:       #050709;          /* near-black — tabs, terminal header */
  --chrome-active:   #0f1419;          /* active tab = notebook bg */
  --divider:         #1c2736;
  --term-bg:         #050709;          /* matches chrome-bg */
  --term-border:     #2a3a4f;

  --text-1: #d4dce8;
  --text-2: #9baabd;
  --text-3: #6b7d93;
  --output-text: #7ca0bf;

  --selection-bg: rgba(86, 212, 160, 0.15);
  --panel-shadow: none;
  --scrollbar-thumb: #2a3a4f;
}

.xterm .xterm-viewport::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px;}
.term-tab{display:flex;align-items:center;gap:4px;padding:3px 10px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-3);cursor:pointer;border-radius:4px 4px 0 0;transition:color .12s,background .12s;white-space:nowrap;user-select:none;}
.term-tab:hover{color:var(--text-2);background:rgba(128,128,128,.06);}
.term-tab.active{color:var(--text-1);background:var(--term-bg);border-bottom:2px solid var(--accent);}
.term-tab .close-x{opacity:0;font-size:9px;padding:1px 3px;border-radius:3px;transition:opacity .1s,background .1s;}
.term-tab:hover .close-x,.term-tab.active .close-x{opacity:.6;}
.term-tab .close-x:hover{opacity:1;background:rgba(220,53,69,.15);color:var(--status-error);}

/* ═══ Undo Toast ═══ */
#undo-toast{position:fixed;bottom:20px;left:20px;z-index:9999;background:var(--panel-bg);border:1px solid var(--cell-border-hov);border-radius:8px;padding:10px 16px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-2);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;}
#undo-toast.show{opacity:1;transform:translateY(0);pointer-events:auto;}
#undo-toast kbd{background:var(--chrome-bg);border:1px solid var(--cell-border);border-radius:3px;padding:1px 5px;font-size:11px;color:var(--accent);}

/* ═══ File Editor ═══ */
.file-editor-wrap{height:100%;display:flex;flex-direction:column;}
.cm-file-editor{flex:1;min-height:0;}
.cm-file-editor .cm-editor{height:100%;}

/* ═══ Ghost Toolbar Buttons ═══ */
.tb-btn{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;font-size:11px;font-family:-apple-system,sans-serif;border:none;background:transparent;color:var(--text-3);cursor:pointer;transition:all .12s;white-space:nowrap;}
.tb-btn:hover{color:var(--text-1);background:rgba(128,128,128,.1);}
.tb-btn:active{background:rgba(128,128,128,.15);}
.tb-btn.stale{color:var(--status-running);}
.tb-btn.stale:hover{background:rgba(212,160,86,.08);}
.tb-btn.stop{color:var(--status-error);}
.tb-btn.stop:hover{background:rgba(220,53,69,.08);}
.tb-btn svg{width:9px;height:9px;}
.toolbar-sep{width:1px;height:14px;background:var(--divider);margin:0 4px;}
/* Theme toggle button */
#theme-toggle-btn:hover{background:rgba(212,117,154,.18) !important;border-color:var(--accent) !important;}

</div><script>(function() {
  if (window._fileExplorerInit) return;
  window._fileExplorerInit = true;

  var tree = document.getElementById('file-tree');
  var ctxMenu = document.getElementById('file-context-menu');
  var _ctxTarget = null;      // sl-tree-item that was right-clicked
  var _clickTimer = null;     // debounce single-click vs double-click

  if (!tree) return;

  // ── File selection: single click opens text files ──
  var _openableTypes = {'jl':1, 'toml':1, 'md':1, 'yml':1, 'git':1, 'lic':1, 'generic':1};
  tree.addEventListener('sl-selection-change', function(e) {
    var items = e.detail.selection;
    if (!items || !items.length) return;
    var item = items[0];
    if (item.hasAttribute('data-is-dir')) return;
    var fileType = item.dataset.fileType;
    var absPath = item.dataset.absPath;
    if (absPath && window.TherapyWS && _openableTypes[fileType]) {
      clearTimeout(_clickTimer);
      _clickTimer = setTimeout(function() {
        TherapyWS.sendMessage('notebook', {action: 'open_notebook', path: absPath});
      }, 250);
    }
  });

  // ── Lazy loading: fetch directory contents on expand ──
  // sl-lazy-load fires on the sl-tree-item itself; use closest() for safety
  tree.addEventListener('sl-lazy-load', function(e) {
    var item = e.target.closest ? e.target.closest('sl-tree-item[lazy]') : e.target;
    if (!item || !item.dataset || !item.dataset.path) {
      console.warn('[FileExplorer] sl-lazy-load: no item or path', e.target);
      return;
    }
    var dirPath = item.dataset.path;
    console.log('[FileExplorer] lazy-load:', dirPath);
    if (window.TherapyWS && TherapyWS.sendMessage) {
      TherapyWS.sendMessage('file_explorer', {action: 'list_dir', path: dirPath});
    } else {
      console.warn('[FileExplorer] TherapyWS not ready');
      // Remove lazy so spinner stops — will show empty folder
      item.removeAttribute('lazy');
    }
  });

  // ── Context menu: right-click ──
  tree.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var item = e.target.closest('sl-tree-item');
    if (!item) return;
    _ctxTarget = item;
    var isDir = item.hasAttribute('data-is-dir');

    // Show/hide directory-only items
    ctxMenu.querySelector('.fm-new-file').style.display = isDir ? '' : 'none';
    ctxMenu.querySelector('.fm-new-folder').style.display = isDir ? '' : 'none';

    // Position and show
    var x = e.clientX, y = e.clientY;
    ctxMenu.style.display = 'block';
    // Clamp to viewport
    var rect = ctxMenu.getBoundingClientRect();
    if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 8;
    if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 8;
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top = y + 'px';
  });

  // Close context menu on click outside
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#file-context-menu')) {
      ctxMenu.style.display = 'none';
    }
  });
  document.addEventListener('contextmenu', function(e) {
    if (!e.target.closest('#file-tree')) {
      ctxMenu.style.display = 'none';
    }
  });

  // ── Context menu actions ──
  ctxMenu.addEventListener('click', function(e) {
    var item = e.target.closest('.file-ctx-item');
    if (!item || !_ctxTarget) return;
    var action = item.dataset.action;
    ctxMenu.style.display = 'none';

    if (action === 'rename') {
      startInlineRename(_ctxTarget);
    } else if (action === 'delete') {
      var name = _ctxTarget.querySelector('.tree-label');
      var displayName = name ? name.textContent : _ctxTarget.dataset.path;
      var isDir = _ctxTarget.hasAttribute('data-is-dir');
      if (confirm('Delete ' + (isDir ? 'folder' : 'file') + ' "' + displayName + '"?')) {
        if (window.TherapyWS) {
          TherapyWS.sendMessage('file_explorer', {
            action: 'delete', path: _ctxTarget.dataset.path
          });
        }
      }
    } else if (action === 'new_file' || action === 'new_folder') {
      var promptMsg = action === 'new_file' ? 'New file name:' : 'New folder name:';
      var name = prompt(promptMsg);
      if (name && name.trim()) {
        if (window.TherapyWS) {
          TherapyWS.sendMessage('file_explorer', {
            action: action === 'new_file' ? 'create_file' : 'create_dir',
            parent_path: _ctxTarget.dataset.path,
            name: name.trim()
          });
        }
      }
    }
  });

  // ── Inline rename: double-click ──
  tree.addEventListener('dblclick', function(e) {
    var item = e.target.closest('sl-tree-item');
    if (!item) return;
    e.preventDefault();
    clearTimeout(_clickTimer);  // cancel the single-click open
    startInlineRename(item);
  });

  function startInlineRename(item) {
    var label = item.querySelector('.tree-label');
    if (!label) return;
    var oldName = label.textContent;
    var input = document.createElement('input');
    input.type = 'text';
    input.value = oldName;
    input.className = 'tree-rename-input';

    label.style.display = 'none';
    label.parentNode.insertBefore(input, label.nextSibling);
    input.focus();
    // Select name without extension for files
    var dotIdx = oldName.lastIndexOf('.');
    if (dotIdx > 0 && !item.hasAttribute('data-is-dir')) {
      input.setSelectionRange(0, dotIdx);
    } else {
      input.select();
    }

    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var newName = input.value.trim();
      input.remove();
      label.style.display = '';
      if (newName && newName !== oldName) {
        label.textContent = newName;
        if (window.TherapyWS) {
          TherapyWS.sendMessage('file_explorer', {
            action: 'rename', path: item.dataset.path, new_name: newName
          });
        }
      }
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { ev.preventDefault(); input.value = oldName; commit(); }
    });
  }

  // ── Navigate to parent directory ──
  var upBtn = document.getElementById('tree-nav-up');
  if (upBtn) {
    upBtn.addEventListener('click', function() {
      if (window.TherapyWS) {
        TherapyWS.sendMessage('file_explorer', {action: 'navigate_up'});
      }
    });
  }

  // ── WebSocket response handler for file_explorer channel ──
  window.addEventListener('therapy:channel:file_explorer', function(e) {
    var data = e.detail;
    if (!data || !data.event) return;

    if (data.event === 'dir_contents') {
      // Lazy-load response: find the tree item and inject children
      var item = tree.querySelector('sl-tree-item[data-path="' + CSS.escape(data.path) + '"]');
      if (item) {
        // Remove the lazy attribute so it doesn't fire again
        item.removeAttribute('lazy');
        // Parse and append children
        var tmp = document.createElement('div');
        tmp.innerHTML = data.children_html;
        while (tmp.firstChild) {
          item.appendChild(tmp.firstChild);
        }
      }
    }

    else if (data.event === 'file_deleted') {
      var item = tree.querySelector('sl-tree-item[data-path="' + CSS.escape(data.path) + '"]');
      if (item) item.remove();
    }

    else if (data.event === 'file_renamed') {
      var item = tree.querySelector('sl-tree-item[data-path="' + CSS.escape(data.old_path) + '"]');
      if (item) {
        item.dataset.path = data.new_path;
        if (data.new_abs_path) item.dataset.absPath = data.new_abs_path;
        var label = item.querySelector('.tree-label');
        if (label) label.textContent = data.new_name;
      }
    }

    else if (data.event === 'item_created') {
      // Find parent and append the new item
      var parent = tree.querySelector('sl-tree-item[data-path="' + CSS.escape(data.parent_path) + '"]');
      if (parent) {
        var tmp = document.createElement('div');
        tmp.innerHTML = data.item_html;
        while (tmp.firstChild) {
          parent.appendChild(tmp.firstChild);
        }
        // Expand parent if collapsed
        if (!parent.expanded) parent.expanded = true;
      }
    }

    else if (data.event === 'tree_replaced') {
      // Full tree refresh (e.g., after navigating to parent dir)
      var wrapper = document.getElementById('file-tree-wrapper');
      if (wrapper) wrapper.innerHTML = data.tree_html;
      // Update breadcrumb
      var crumb = document.querySelector('.tree-breadcrumb .crumb');
      if (crumb && data.root_name) crumb.textContent = data.root_name;
    }
  });
})();

      delete _cellTimers[cellId];
    }
  }

  // ── Helper: update cell CSS state (accent bar color) ──
  function setCellState(el, state, cellId) {
    if (!el) return;
    var cc = el.code;
    if (!cc) return;
    cc.classList.remove('idle', 'stale', 'executing');
    // Queued/running: colored border + hide the green/orange side accent bar
    if (state === 'cell_queued' || state === 'cell_running') {
      cc.style.borderColor = state === 'cell_queued' ? '#d4a056' : '#7bb8e8';
      cc.classList.add('executing');
      // Start live stopwatch when cell begins running
      if (state === 'cell_running' && cellId) {
        startCellTimer(cellId, el);
      }
    } else {
      if (cellId) stopCellTimer(cellId);
      if (state === 'cell_errored') {
        cc.style.borderColor = '#e06b65';
      } else {
        cc.style.borderColor = '';  // revert to CSS default
      }
    }
  }

  window.addEventListener('therapy:channel:notebook', function(e) {
    var data = e.detail;
    if (!data || !data.event) return;

    if (data.event === 'cell_state') {
      var el = cellEls(data.cell_id);
      setCellState(el, data.state, data.cell_id);
    }

    else if (data.event === 'format_started') {
      // Show spinner on all Format buttons
      document.querySelectorAll('[data-format-btn]').forEach(function(btn) {
        btn.dataset.origText = btn.textContent;
        btn.textContent = 'Formatting...';
        btn.style.opacity = '0.6';
        btn.style.pointerEvents = 'none';
      });
    }

    else if (data.event === 'format_done') {
      // Restore Format buttons
      document.querySelectorAll('[data-format-btn]').forEach(function(btn) {
        btn.textContent = btn.dataset.origText || 'Format';
        btn.style.opacity = '';
        btn.style.pointerEvents = '';
      });
    }

    else if (data.event === 'cell_formatted') {
      markUnsaved();
      // Update CodeMirror editor with formatted code
      var eds = window._sessionsEditors || {};
      var ev = eds[data.cell_id];
      if (ev && data.code !== undefined) {
        var currentCode = ev.state.doc.toString();
        if (data.code !== currentCode) {
          window._sessSuppressSync[data.cell_id] = true;  // don't echo back to server
          ev.dispatch({
            changes: {from: 0, to: currentCode.length, insert: data.code}
          });
        }
      }
    }

    else if (data.event === 'cell_code_updated') {
      // External edit (agent, git, IDE) changed cell code on the server.
      // Push the new code into the CM editor so Run Stale sends the right content.
      var eds = window._sessionsEditors || {};
      var ev = eds[data.cell_id];
      if (ev && data.code !== undefined) {
        var currentCode = ev.state.doc.toString();
        if (data.code !== currentCode) {
          window._sessSuppressSync[data.cell_id] = true;  // don't echo back to server
          ev.dispatch({
            changes: {from: 0, to: currentCode.length, insert: data.code}
          });
        }
      }
    }

    else if (data.event === 'cell_output') {
      var el = cellEls(data.cell_id);
      if (!el) return;

      if (el.out) {

        if (html) {

          el.out.style.display = '';

            newScript.textContent = oldScript.textContent;

          });

          // (WebSlider WASM signal needs to be initialized)
          if (window.__hydrateTherapyIslands) {

      setCellState(el, data.state, data.cell_id);

        badge.style.cssText = 'font-size:10px;font-family:ui-monospace,monospace;padding:1px 7px;border-radius:9999px;opacity:.8;color:'+c+';background:rgba('+(isErr?'224,107,101':'86,212,160')+',.08);border:1px solid rgba('+(isErr?'224,107,101':'86,212,160')+',.12);';

      if (!nb) return;

      // Create a temp container to parse the HTML

        if (afterWrap) {

          var ref = afterWrap.nextElementSibling;
          if (ref && ref.classList.contains('cdiv')) ref = ref.nextElementSibling;

      if (toast) {
        toast.classList.add('show');
        if (window._undoToastTimer) clearTimeout(window._undoToastTimer);
        window._undoToastTimer = setTimeout(function() {
          toast.classList.remove('show');
          window._recentlyDeleted = null;
        }, 8000);
      }
      // Remove cell from DOM in-place (no page reload)
      var wrap = document.querySelector('.cell-wrap[data-cell-id="' + data.cell_id + '"]');
      if (wrap) {
        // Also remove the divider after this cell
        var next = wrap.nextElementSibling;
        if (next && next.classList.contains('cdiv')) next.remove();

      delete editors[data.cell_id];

    else if (data.event === 'cell_moved') {

      var cellWrap = container.querySelector('.cell-wrap[data-cell-id="' + data.cell_id + '"]');
      if (!cellWrap) return;

        var prevDiv = cellWrap.previousElementSibling; // divider before this cell
        if (!prevDiv) return;

        if (!prevCell || !prevCell.classList.contains('cell-wrap')) return;
        // Move this cell+divider before the previous cell
        container.insertBefore(cellWrap, prevCell);
        if (divider && divider.classList.contains('cdiv')) container.insertBefore(divider, prevCell);

    }

    else if (data.event === 'tabs_changed') {

      setTimeout(function(){ window.location.reload(); }, 200);
    }

    else if (data.event === 'saved') {

    }

    else if (data.event === 'stale_update') {

      var btn = document.getElementById('run-stale-btn');
      var label = document.getElementById('run-stale-label');
      if (btn) {
        if (data.count > 0 && !window._sessionsExecuting) {
          btn.style.display = '';
          if (label) label.textContent = ' Run Stale (' + data.count + ')';
        } else {
          btn.style.display = 'none';
        }
      }
      // Toggle stale class on cell accent bars
      var staleSet = new Set(data.stale_ids || []);
      document.querySelectorAll('.code-cell').forEach(function(el) {
        var wrap = el.closest('.cell-wrap');
        var cid = wrap ? wrap.dataset.cellId : null;

          el.classList.add('stale');
        } else {
          el.classList.remove('stale');
        }
      });
    }

    else if (data.event === 'run_progress') {
      var isRunning = data.running_index > 0 && data.total > 0;
      window._sessionsExecuting = isRunning;
      var el = document.getElementById('run-progress');
      if (el) {
        if (isRunning) {
          el.textContent = 'Running ' + data.running_index + '/' + data.total + '...';
          el.style.display = '';
        } else {
          el.textContent = '';
          el.style.display = 'none';
        }
      }

      var runAllBtn = document.getElementById('run-all-btn');
      var stopBtn = document.getElementById('stop-btn');
      var runStaleBtn = document.getElementById('run-stale-btn');
      if (runAllBtn && stopBtn) {
        if (isRunning) {
          runAllBtn.style.display = 'none';
          stopBtn.style.display = '';
          if (runStaleBtn) runStaleBtn.style.display = 'none';
        } else {
          runAllBtn.style.display = '';
          stopBtn.style.display = 'none';
          // Run Stale restored by the stale_update event that follows
        }

      }

      console.log('[Sessions] Full state:', data.cells ? data.cells.length : 0, 'cells');

            el.out.querySelectorAll('script').forEach(function(oldScript) {

      }

  var _cellMenu = document.createElement('div');

    '<div class="cell-menu-down" style="' + _menuItemStyle + '"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 13V3M4 9l4 4 4-4"/></svg>Move down</div>' +
    '<div style="height:1px;background:#2a3a4f;margin:2px 8px;"></div>' +
    '<div class="cell-menu-format" style="' + _menuItemStyle + '"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 3h12M2 6h8M2 9h10M2 12h6"/></svg>Format cell</div>' +
    '<div style="height:1px;background:#2a3a4f;margin:2px 8px;"></div>' +
    '<div class="cell-menu-delete" style="' + _menuItemStyle + '"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1M6 7v5M10 7v5"/><path d="M3 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9"/></svg>Delete cell</div>';
  document.body.appendChild(_cellMenu);
  var _menuCellId = '';

  // Hover effects for all menu items
  _cellMenu.querySelectorAll('[class^="cell-menu-"]').forEach(function(item) {
    var isDelete = item.classList.contains('cell-menu-delete');
    item.addEventListener('mouseenter', function(){
      this.style.background = isDelete ? 'rgba(224,107,101,.12)' : 'rgba(86,212,160,.08)';
      this.style.color = isDelete ? '#e06b65' : '#d4dce8';
    });
    item.addEventListener('mouseleave', function(){ this.style.background=''; this.style.color='#9baabd'; });
  });

  // Move up action
  _cellMenu.querySelector('.cell-menu-up').addEventListener('click', function(){
    _cellMenu.style.display = 'none';
    if (_menuCellId) TherapyWS.sendMessage('notebook', {action: 'move_cell', cell_id: _menuCellId, direction: 'up'});
  });

  // Move down action
  _cellMenu.querySelector('.cell-menu-down').addEventListener('click', function(){
    _cellMenu.style.display = 'none';
    if (_menuCellId) TherapyWS.sendMessage('notebook', {action: 'move_cell', cell_id: _menuCellId, direction: 'down'});
  });

  // Format cell action
  _cellMenu.querySelector('.cell-menu-format').addEventListener('click', function(){
    _cellMenu.style.display = 'none';
    if (_menuCellId) TherapyWS.sendMessage('notebook', {action: 'format_cell', cell_id: _menuCellId});
  });

  // Delete action (no confirm — undo available via Ctrl+Z)
  _cellMenu.querySelector('.cell-menu-delete').addEventListener('click', function(){
    _cellMenu.style.display = 'none';
    if (_menuCellId) {
      TherapyWS.sendMessage('notebook', {action: 'delete_cell', cell_id: _menuCellId});

  });

  // Show dropdown next to a menu button (flip above if near bottom of viewport)
  window._sessionsShowCellMenu = function(btn, cellId) {
    _menuCellId = cellId;

    _cellMenu.style.display = 'block';

    if (window.innerHeight - r.bottom < menuH + 8) {

    } else {
      _cellMenu.style.top = (r.bottom + 4) + 'px';

  // Close on click outside
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.menu-btn') && _cellMenu.style.display !== 'none') {
      _cellMenu.style.display = 'none';
    }
  });

// Therapy.jl Client-Side Router

    'use strict';

    // On static sites, loadPage() extracts inline scripts from the fetched full HTML page.
    // This router script contains 'TherapyWS' references, so it matches the extraction filter
    // and gets re-executed on every navigation. Without this guard, each execution adds another
    // click listener, causing exponential request duplication (1→2→4→8 navigations per click).

        return;
    }

        contentSelector: '#page-content',

                continue;
            }

            // Registry uses lowercase keys (see Hydration.jl)
            const registryKey = componentName.toLowerCase();
            log('Looking for hydration function:', componentName, '-> registry key:', registryKey);
            log('TherapyHydrate registry:', window.TherapyHydrate ? Object.keys(window.TherapyHydrate) : 'undefined');

            // Look for registered hydration function (using lowercase key)
            if (window.TherapyHydrate && typeof window.TherapyHydrate[registryKey] === 'function') {
                try {
                    log('Calling hydration function for:', registryKey);
                    await window.TherapyHydrate[registryKey]();
                    // Mark as hydrated to prevent re-hydration on future navigation
                    island.dataset.hydrated = 'true';
                    log('Hydrated island:', componentName);
                } catch (error) {
                    console.error('[Router] Failed to hydrate island:', componentName, error);
                }
            } else if (window.__hydrateTherapyIsland) {
                // V2 hydration fallback (Leptos-style full-body compilation)
                // V2 islands use a shared hydration script that loads wasm by component name
                try {
                    log('Using v2 hydration for:', componentName);
                    await window.__hydrateTherapyIsland(island);
                    log('Hydrated island (v2):', componentName);
                } catch (error) {
                    console.error('[Router] Failed to hydrate island (v2):', componentName, error);
                }
            } else {
                console.warn('[Router] No hydration function found for:', registryKey);
                console.warn('[Router] Available functions:', window.TherapyHydrate ? Object.keys(window.TherapyHydrate) : 'none');
            }
        }
    }

    /**
     * Update active class on navigation links.
     * Three-class model: class (always-on), active_class (when active), inactive_class (when inactive).
     * Swaps inactive_class <-> active_class to avoid CSS conflicts from competing Tailwind utilities.
     */
    function updateActiveLinks() {
        const currentPath = normalizePath(window.location.pathname);

        document.querySelectorAll('[data-navlink]').forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;

            const linkPath = normalizePath(resolveUrl(href));
            const activeClassAttr = link.dataset.activeClass || 'active';
            const inactiveClassAttr = link.dataset.inactiveClass || '';
            // Split by spaces to handle multiple classes like "text-accent-700 dark:text-accent-400"
            const activeClasses = activeClassAttr.split(/\s+/).filter(c => c.length > 0);
            const inactiveClasses = inactiveClassAttr.split(/\s+/).filter(c => c.length > 0);
            const exact = link.hasAttribute('data-exact');

            let isActive;
            const basePath = normalizePath(CONFIG.basePath || '/');
            if (exact) {
                isActive = linkPath === currentPath;
            } else {
                // Prefix match for nested routes
                // But exclude base path itself (e.g., /Therapy.jl) from prefix matching
                // to avoid Home link being active on all pages
                isActive = currentPath === linkPath ||
                          (linkPath !== '/' && linkPath !== basePath && currentPath.startsWith(linkPath + '/'));
            }

            if (isActive) {
                link.classList.add(...activeClasses);
                if (inactiveClasses.length > 0) link.classList.remove(...inactiveClasses);
            } else {
                link.classList.remove(...activeClasses);
                if (inactiveClasses.length > 0) link.classList.add(...inactiveClasses);
            }
        });
    }

    /**
     * Handle click events on links
     */
    function handleLinkClick(event) {
        // Find the closest anchor tag
        const link = event.target.closest('a[href]');
        if (!link) return;

        const href = link.getAttribute('href');
        log('handleLinkClick: intercepted href=', href, 'from element:', link.tagName);

        // Check if we should handle this link
        if (!isInternalLink(href, link)) {
            log('handleLinkClick: not internal, skipping');
            return;
        }

        log('handleLinkClick: internal link, routing via SPA');

        // Prevent default navigation
        event.preventDefault();

        // Navigate using the router
        navigate(href);
    }

    /**
     * Handle browser back/forward buttons
     */
    function handlePopState(event) {
        const path = window.location.pathname;
        log('Popstate:', path);
        loadPage(path);
    }

    /**
     * Initialize the router
     */
    function init() {
        log('Initializing client-side router');

        // Bind link click handler (delegation on document, capture phase)
        document.addEventListener('click', handleLinkClick, true);

        // Bind popstate for back/forward
        window.addEventListener('popstate', handlePopState);

        // Update active links on initial load
        updateActiveLinks();

        log('Router initialized');
    }

    // Expose API for programmatic navigation
    window.TherapyRouter = {
        navigate,
        loadPage,
        hydrateIslands,
        updateActiveLinks,
        setDebug: (enabled) => { CONFIG.debug = enabled; },
        // Register a callback to run after each navigation
        onNavigate: (callback) => {
            if (!Array.isArray(window._therapyRouterCallbacks)) {
                window._therapyRouterCallbacks = [];
            }
            window._therapyRouterCallbacks.push(callback);
        }
    };

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
<script>
// Therapy.jl WebSocket Client
(function() {
    'use strict';

    // Prevent re-execution during SPA navigation
    if (window.TherapyWS) {
        return;
    }

    const CONFIG = {
        reconnectDelay: 1000,
        maxReconnectDelay: 30000
    };

    let ws = null;
    let reconnectAttempts = 0;
    let connectionId = null;
    let isStaticMode = false;

    const isDevMode = (window.location.hostname === 'localhost' ||
                       window.location.hostname === '127.0.0.1');

    function getWsUrl() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        return protocol + '//' + window.location.host + '/ws';
    }

    function connect() {
        if (isStaticMode) return;
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
        }

        try {
            ws = new WebSocket(getWsUrl());

            ws.onopen = function() {
                console.log('[WS] Connected to server');
                reconnectAttempts = 0;
                window.dispatchEvent(new CustomEvent('therapy:ws:connected'));
            };

            ws.onmessage = function(e) {
                try {
                    const msg = JSON.parse(e.data);
                    handleMessage(msg);
                } catch (err) {
                    console.warn('[WS] Failed to parse message:', e.data);
                }
            };

            ws.onclose = function(e) {
                connectionId = null;
                window.dispatchEvent(new CustomEvent('therapy:ws:disconnected'));
                if (e.code !== 1000) {
                    if (isDevMode) {
                        scheduleReconnect();
                    } else if (reconnectAttempts >= 1) {
                        showStaticModeWarning();
                    } else {
                        reconnectAttempts++;
                        setTimeout(connect, 500);
                    }
                }
            };

            ws.onerror = function(err) {
                if (isDevMode) {
                    console.warn('[WS] Connection error - server may not be running');
                }
            };

        } catch (e) {
            showStaticModeWarning();
        }
    }

    function scheduleReconnect() {
        if (isStaticMode) return;
        const delay = Math.min(
            CONFIG.reconnectDelay * Math.pow(2, reconnectAttempts),
            CONFIG.maxReconnectDelay
        );
        reconnectAttempts++;
        console.log('[WS] Reconnecting in', delay, 'ms (attempt', reconnectAttempts + ')');
        setTimeout(connect, delay);
    }

    function handleMessage(msg) {
        switch (msg.type) {
            case 'connected':
                connectionId = msg.connection_id;
                console.log('[WS] Connection ID:', connectionId);
                break;
            case 'error':
                console.error('[WS] Server error:', msg.message);
                break;
            case 'pong':
                break;
            default:
                // Dispatch as custom event for application-level handling
                window.dispatchEvent(new CustomEvent('therapy:ws:message', {
                    detail: msg
                }));
        }
    }

    function addWarningToElement(el) {
        if (el.querySelector('.ws-warning')) return;
        const warning = document.createElement('div');
        warning.className = 'ws-warning';
        warning.style.cssText = 'background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #f59e0b; border-radius: 8px; padding: 16px; margin-bottom: 16px; color: #92400e;';
        warning.innerHTML = '<strong style="display: block; margin-bottom: 4px;">\u26A0\uFE0F Live Demo Unavailable</strong>' +
            '<span style="font-size: 14px;">This example requires a WebSocket server. Run locally with:</span>' +
            '<code style="display: block; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; font-family: monospace;">julia docs/app.jl dev</code>';
        el.insertBefore(warning, el.firstChild);
    }

    function showStaticModeWarning() {
        if (isStaticMode) return;
        isStaticMode = true;
        console.log('[WS] Static mode detected - WebSocket features unavailable');
        document.querySelectorAll('[data-ws-example]').forEach(addWarningToElement);
        window.dispatchEvent(new CustomEvent('therapy:ws:static_mode'));
    }

    function showStaticModeWarningOnNewElements() {
        if (!isStaticMode) return;
        document.querySelectorAll('[data-ws-example]').forEach(addWarningToElement);
    }

    function send(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(msg));
        }
    }

    function sendAction(action, payload) {
        send({ type: 'action', action: action, payload: payload });
    }

    function isConnected() {
        return ws && ws.readyState === WebSocket.OPEN;
    }

    function getConnectionId() {
        return connectionId;
    }

    function disconnect() {
        if (ws) {
            ws.close(1000, 'Client disconnect');
            ws = null;
        }
    }

    // Expose API globally
    window.TherapyWS = {
        connect: connect,
        disconnect: disconnect,
        showStaticModeWarningOnNewElements: showStaticModeWarningOnNewElements,
        sendAction: sendAction,
        send: send,
        isConnected: isConnected,
        getConnectionId: getConnectionId,
        isStaticMode: function() { return isStaticMode; }
    };

    // Handle data-action clicks
    function setupActionHandlers() {
        document.addEventListener('click', function(e) {
            const el = e.target.closest('[data-action]');
            if (!el) return;

            const action = el.getAttribute('data-action');
            if (!action) return;

            const payload = {};
            for (const attr of el.attributes) {
                if (attr.name.startsWith('data-') && attr.name !== 'data-action') {
                    const key = attr.name.substring(5).replace(/-/g, '_');
                    payload[key] = attr.value;
                }
            }

            if (el.hasAttribute('data-confirm')) {
                const msg = el.getAttribute('data-confirm');
                if (!confirm(msg)) return;
            }

            sendAction(action, payload);
            e.preventDefault();
        });
    }

    // Auto-connect when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            connect();
            setupActionHandlers();
        });
    } else {
        connect();
        setupActionHandlers();
    }
})();
</script>
