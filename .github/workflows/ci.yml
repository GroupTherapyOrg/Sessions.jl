name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout Sessions.jl
        uses: actions/checkout@v4
        with:
          path: Sessions.jl

      # Sessions/Project.toml references Therapy via `path = "../Therapy.jl"`
      # so CI needs a sibling checkout to resolve that source.
      - name: Checkout Therapy.jl
        uses: actions/checkout@v4
        with:
          repository: GroupTherapyOrg/Therapy.jl
          path: Therapy.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          cd Sessions.jl
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Run tests
        run: |
          cd Sessions.jl
          julia --project=. test/runtests.jl
